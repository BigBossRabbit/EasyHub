name: feeds-sync-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feeds-sync
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build feeds.json (SN jobs, HRF careers, GitHub bounties, SN news)
        run: node scripts/build_feeds.mjs
      - name: Build site
        run: npm run build
      - name: Commit feeds.json to main if changed
        run: |
          git config user.name "feeds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/feeds.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feeds: refresh $(date -u +%FT%TZ)"
            git fetch origin main
            # conflict-tolerant rebase: this run's build is the freshest, so it wins
            if ! git rebase --autostash origin/main; then
              git checkout --theirs public/feeds.json
              git add public/feeds.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin main
          fi
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
